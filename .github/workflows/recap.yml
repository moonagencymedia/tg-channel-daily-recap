name: Recap subs 21h

on:
  schedule:
    - cron: "0 19 * * *"   # 21 h Paris en heure d'ete (CEST)
    - cron: "0 20 * * *"   # 21 h Paris en heure d'hiver (CET) — le script ignore l'autre
  workflow_dispatch:
    inputs:
      force:
        description: "Poster tout de suite, sans attendre 21 h"
        type: boolean
        default: true
      day:
        description: "Journee complete d'un jour passe (YYYY-MM-DD), vide = aujourd'hui"
        type: string
        default: ""

concurrency:
  group: recap-subs
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Recap
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TG_SUBS_CHANNEL: ${{ vars.TG_SUBS_CHANNEL || 'la vie secrète' }}
          FORCE: ${{ inputs.force == true && '1' || '0' }}
          DAY: ${{ inputs.day }}
        run: |
          if [ -n "$DAY" ]; then python recap_subs.py --day "$DAY"; else python recap_subs.py; fi
