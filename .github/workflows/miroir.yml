name: Miroir canal

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub decale parfois de quelques minutes : les posts programmes, eux, sortent a l'heure
  workflow_dispatch:

concurrency:
  group: miroir
  cancel-in-progress: false

jobs:
  miroir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-miroir.txt
      - run: pip install -r requirements-miroir.txt
      - name: Miroir
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_MIROIR: ${{ secrets.TG_SESSION_MIROIR }}
          MIROIR_SOURCE: ${{ secrets.MIROIR_SOURCE }}
          MIROIR_CIBLE: ${{ secrets.MIROIR_CIBLE }}
          MIROIR_DEPUIS: ${{ secrets.MIROIR_DEPUIS }}
        run: python miroir.py
