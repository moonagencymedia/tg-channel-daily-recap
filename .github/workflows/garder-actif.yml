name: Garder actif

# GitHub coupe les workflows programmes d'un depot public sans commit depuis 60 jours.
# Un commit vide par mois garde le recap et le miroir en marche.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Garder les workflows programmes actifs"
          git push
